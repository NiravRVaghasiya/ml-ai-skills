# Weekly version-bump PRs. Actions are pinned to commit SHAs with a "# vX.Y.Z" comment;
# Dependabot updates both together. Python pins live in requirements-dev.txt and
# requirements-examples.txt. Not covered: the Claude Code CLI version (CLAUDE_CODE_VERSION
# in ci.yml) - bump it by hand (see the ci.yml header).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The example environment is large and its pins move together (torch/torchvision,
      # transformers/tokenizers/peft/trl, ...); one grouped PR is easier to test as a whole.
      dev-tools:
        patterns: ["ruff", "shellcheck-py", "coverage", "PyYAML", "jsonschema", "pip-audit"]
      example-deps:
        patterns: ["*"]
        exclude-patterns: ["ruff", "shellcheck-py", "coverage", "PyYAML", "jsonschema", "pip-audit"]
    commit-message:
      prefix: "deps"
