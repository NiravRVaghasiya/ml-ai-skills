# Weekly version-bump PRs. Actions are pinned to commit SHAs with a "# vX.Y.Z" comment;
# Dependabot updates both together. Python pins live in requirements-dev.txt and
# requirements-examples.txt. Not covered: the Claude Code CLI version (CLAUDE_CODE_VERSION
# in ci.yml) - bump it by hand (see the ci.yml header).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The example environment is large and its pins move together (torch/torchvision,
      # transformers/tokenizers/peft/trl, ...); one grouped PR is easier to test as a whole.
      dev-tools:
        patterns: ["ruff", "shellcheck-py", "coverage", "PyYAML", "jsonschema", "pip-audit"]
      example-deps:
        patterns: ["*"]
        exclude-patterns: ["ruff", "shellcheck-py", "coverage", "PyYAML", "jsonschema", "pip-audit"]
    # Dependabot bumps each exact pin on its own and does not check the pins against each
    # other's requirements. Hold back versions an upper bound in a pinned package rejects;
    # drop an entry once that package lifts its cap. Before merging a bump, check the whole
    # file resolves: `pip install --dry-run --ignore-installed -r requirements-examples.txt`
    # (pip names only the first conflict it hits).
    ignore:
      # mlflow 3.17.2 requires pyarrow<26 (the 26.0.0 bump failed pip's resolver in CI).
      - dependency-name: "pyarrow"
        versions: [">=26"]
      # albumentations 2.0.8 pins albucore==0.0.24 exactly.
      - dependency-name: "albucore"
        versions: [">0.0.24"]
      # evidently 0.7.23 requires plotly<6.
      - dependency-name: "plotly"
        versions: [">=6"]
    commit-message:
      prefix: "deps"
