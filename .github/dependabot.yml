# Weekly version-bump PRs. Actions are pinned to commit SHAs with a "# vX.Y.Z" comment;
# Dependabot updates both together. Python pins live in requirements-dev.txt and
# requirements-examples.txt. Not covered: the Claude Code CLI version (CLAUDE_CODE_VERSION
# in ci.yml) - bump it by hand (see the ci.yml header) - and the locks in constraints/,
# which no requirements file references, so Dependabot is not expected to edit them.
#
# Every pip bump therefore fails ci.yml's deps job until the matching lock is regenerated in
# the same PR: download the PR's dependency-locks artifact (the deps job resolves the bumped
# file on Linux/CPython 3.13 and uploads fresh locks), commit them to constraints/, and push.
# docs/REPRODUCIBILITY.md "Dependency locks" has the local commands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The dev tools are grouped, only for minor/patch bumps: they do not depend on each
      # other's pins. Example packages get one PR per pin, apart from the two small coupled
      # groups below: the grouped example-deps PR #3 (pattern "*") bumped many interdependent
      # pins at once and produced a set pip could not resolve, and a single-pin PR names the
      # bump that breaks resolution. albumentations/albucore is not grouped: albumentations
      # 2.0.8 pins albucore==0.0.24 exactly, so albucore is held by the ignore list instead.
      dev-tools:
        patterns: ["ruff", "shellcheck-py", "coverage", "PyYAML", "jsonschema", "pip-audit", "packaging", "markdown-it-py"]
        update-types: ["minor", "patch"]
      # The only example groups: pins that have to move together, so one of them alone either
      # cannot resolve or installs a pair that does not work.
      # torchvision is built against one torch release (its metadata only says torch>=2.14.0
      # for 0.29.1, but its compiled ops follow PyTorch's torch/torchvision version table).
      torch:
        patterns: ["torch", "torchvision"]
      # transformers 5.21.0 requires tokenizers<0.24.0,>=0.23.1.
      transformers-tokenizers:
        patterns: ["transformers", "tokenizers"]
    # Dependabot bumps each exact pin on its own and does not check the pins against each
    # other's requirements. Hold back versions an upper bound in a pinned package rejects;
    # drop an entry once that package lifts its cap. ci.yml's deps job dry-run-resolves the
    # whole bumped file on Linux/CPython 3.13 (`pip install --dry-run --ignore-installed -r
    # requirements-examples.txt`); pip names only the first conflict it hits.
    ignore:
      # mlflow 3.17.2 requires pyarrow<26 (the 26.0.0 bump failed pip's resolver in CI).
      - dependency-name: "pyarrow"
        versions: [">=26"]
      # albumentations 2.0.8 pins albucore==0.0.24 exactly.
      - dependency-name: "albucore"
        versions: [">0.0.24"]
      # evidently 0.7.23 requires plotly<6.
      - dependency-name: "plotly"
        versions: [">=6"]
      # evidently 0.7.23 declares no pandas cap but fails to import on pandas 3 (it imports
      # pandas.core.dtypes.common.infer_dtype_from_object, removed in 3.0).
      - dependency-name: "pandas"
        versions: [">=3"]
    commit-message:
      prefix: "deps"
