name: skill-library-ci

# Quality gates for every push to main and every pull request. Stages:
#   lint -> validate -> unit (3.10 + 3.13, stdlib only) / unit-with-dev-deps (coverage)
#   examples (executes SKILL.md code), evals-offline, generated (artifact drift),
#   installer (ubuntu + macOS), plugins (claude CLI), security (workflow audit, pip-audit, bandit rules)
# The network freshness check lives in freshness-scheduled.yml; link-check below is manual only.
#
# Hardening (enforced by scripts/audit_workflows.py, run in lint and security): read-only
# token by default, no pull_request_target, no secrets, every action pinned to a full
# commit SHA, checkout without persisted credentials, a timeout on every job, and no event
# data or ref names expanded inside run: scripts (directly or via ${{ env.X }}). The audit is
# a static, textual check - see its docstring for what it cannot trace.
#
# Updating pinned versions
#   * Actions: Dependabot (.github/dependabot.yml) opens weekly PRs that bump the SHA and
#     the "# vX.Y.Z" comment together. Manual bump: resolve the tag to a commit with
#       git ls-remote https://github.com/actions/checkout 'refs/tags/v7.0.1^{}' 'refs/tags/v7.0.1'
#     (use the peeled ^{} line when present - that is the commit an annotated tag points to),
#     check `runs.using` in the action.yml at that SHA (node24 or later: GitHub is retiring
#     the Node 20 runtime on hosted runners), replace the SHA *and* the comment in ci.yml,
#     release.yml and freshness-scheduled.yml, then run
#       python scripts/audit_workflows.py --strict
#     Current pins (resolved with git ls-remote on 2026-10-28; all lightweight tags, all
#     `using: node24`): checkout v7.0.1, setup-python v7.1.0, setup-node v7.1.0,
#     upload-artifact v7.0.2; attest-build-provenance v4.2.2 in release.yml (composite, wraps
#     actions/attest v4.2.1, node24).
#   * Python tools: requirements-dev.txt / requirements-examples.txt (Dependabot, weekly).
#   * Claude Code CLI: CLAUDE_CODE_VERSION below (not covered by Dependabot; bump by hand
#     after checking https://registry.npmjs.org/@anthropic-ai/claude-code).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push runs are grouped per commit, so a newer push to main never cancels (or displaces while
# pending) an older commit's run: release.yml needs a successful push run for the exact tagged
# commit. Pull requests and manual runs share one group per ref; superseded PR runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  CLAUDE_CODE_VERSION: "2.1.311"

jobs:
  lint:
    name: Lint (ruff, shellcheck, workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned ruff and shellcheck from requirements-dev.txt
        run: |
          set -euo pipefail
          python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)" "$(grep -E '^shellcheck-py==' requirements-dev.txt)"
          ruff --version
          shellcheck --version
      - name: ruff (rules and per-file ignores in ruff.toml)
        run: ruff check --output-format=github .
      - name: shellcheck (config in .shellcheckrc)
        run: shellcheck install.sh uninstall.sh bin/ml-ai-skills
      - name: Audit GitHub workflows
        run: python scripts/audit_workflows.py --strict

  validate:
    name: Validate skills, schema, contract, evals, claims
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 for the contract check: the base branch tip on a pull_request run (HEAD is
          # GitHub's test merge commit), the previous commit on a push.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # No pip install: scripts/ are stdlib-only.
      - name: Skill frontmatter, sections, relationships
        run: python scripts/validate_skills.py --warnings
      - name: Generated JSON Schema matches schema/allowed_values.py
        run: python scripts/generate_schema.py --check
      - name: Public contract matches its lock, and the VERSION rules hold vs the base commit's lock
        # The same-commit lock can be hand-edited to match a breaking tree; the base commit's lock
        # cannot, so a BREAKING change without a major bump fails here (docs/SKILL-SPEC.md).
        run: python scripts/check_contract.py --check --base-ref HEAD^1
      - name: Eval cases (strict, every skill covered)
        run: python scripts/validate_evals.py --strict --require-full-coverage
      - name: Claims registry review clock
        run: python scripts/check_claims.py
      - name: Offline freshness scan (fails on STALE only; REVIEW_DUE is printed)
        run: python scripts/check_freshness.py

  unit:
    name: Unit tests (stdlib only, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Every tests/test_*.py except test_install*.py, which the installer job runs on
      # ubuntu and macOS (~9 min). Skips are listed in the job summary with their reasons:
      # here PyYAML/jsonschema cross-checks skip (they run in unit-with-dev-deps) and the
      # claude-CLI tests skip (they run in plugins).
      - name: Run unit tests
        run: |
          set -euo pipefail
          mods=()
          for f in tests/test_*.py; do
            case "$f" in tests/test_install*) continue ;; esac
            m="${f#tests/}"; mods+=("${m%.py}")
          done
          echo "modules: ${mods[*]}"
          PYTHONPATH=tests python -m unittest -v "${mods[@]}" 2>&1 | tee unit.log
      - name: Report skipped tests
        if: always()
        run: |
          # No pipefail in the default shell, and grep exits 1 on "no match": test the
          # grep itself, so an empty list prints "none" and a missing log says so.
          {
            echo "### Skipped tests (Python ${PY_VERSION})"
            if [ ! -f unit.log ]; then
              echo "- (no unit.log: the test step did not run)"
            elif grep -E '\.\.\. skipped|^setUpClass .* skipped' unit.log > "$RUNNER_TEMP/skipped.txt"; then
              sed 's/^/- /' "$RUNNER_TEMP/skipped.txt"
            else
              echo "none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PY_VERSION: ${{ matrix.python }}

  unit-with-dev-deps:
    name: Unit tests with PyYAML/jsonschema + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install requirements-dev.txt
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests under coverage
        run: |
          set -euo pipefail
          mods=()
          for f in tests/test_*.py; do
            case "$f" in tests/test_install*) continue ;; esac
            m="${f#tests/}"; mods+=("${m%.py}")
          done
          PYTHONPATH=tests python -m coverage run --branch --source=scripts,schema -m unittest -v "${mods[@]}" 2>&1 | tee unit.log
      - name: The YAML-parity and JSON-Schema cross-checks must have run, not skipped
        run: |
          if grep -E 'skipped .*(PyYAML|jsonschema)' unit.log; then
            echo "::error::PyYAML/jsonschema tests skipped although requirements-dev.txt was installed"
            exit 1
          fi
      - name: Coverage report (in-process coverage of scripts/ and schema/)
        # 84 = the branch-coverage total measured locally on 2026-10-27 (87%: 5262 statements,
        # 2276 branches; Python 3.13 on Windows, same command, with scikit-learn/openai also
        # installed) minus a 3-point margin for platform-dependent branches and the few tests
        # that skip here without scikit-learn. Scripts launched as subprocesses are not
        # measured, so CLI-only paths are under-counted. Raise the floor as coverage grows.
        run: |
          python -m coverage report --show-missing --skip-covered --fail-under=84
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: pip-audit the installed dev environment (transitive dependencies included)
        # requirements-dev.txt pins only the top-level tools; this audits everything pip
        # resolved for them (pip/setuptools themselves are runner-provided and not listed).
        run: |
          set -euo pipefail
          python -m pip freeze > "$RUNNER_TEMP/dev-freeze.txt"
          wc -l < "$RUNNER_TEMP/dev-freeze.txt"
          pip-audit --progress-spinner off --disable-pip --no-deps -r "$RUNNER_TEMP/dev-freeze.txt"
      - name: Report skipped tests
        if: always()
        run: |
          # No pipefail in the default shell, and grep exits 1 on "no match": test the
          # grep itself, so an empty list prints "none" and a missing log says so.
          {
            echo "### Skipped tests (with dev deps)"
            if [ ! -f unit.log ]; then
              echo "- (no unit.log: the test step did not run)"
            elif grep -E '\.\.\. skipped|^setUpClass .* skipped' unit.log > "$RUNNER_TEMP/skipped.txt"; then
              sed 's/^/- /' "$RUNNER_TEMP/skipped.txt"
            else
              echo "none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  examples:
    name: Executed SKILL.md examples + executable evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A missing example dependency fails instead of skipping (tests/examples/harness.py).
      ML_AI_SKILLS_REQUIRE_EXAMPLE_DEPS: "1"
      # The harness appends the block indices each run_blocks call executed here;
      # scripts/check_example_coverage.py then fails on any runnable block never executed.
      ML_AI_SKILLS_EXAMPLE_COVERAGE: ${{ github.workspace }}/example-coverage.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-examples.txt
      - name: Install requirements-examples.txt (CPU-only torch from the PyTorch index)
        id: install
        run: |
          python -m pip install -r requirements-examples.txt
          python -m pip freeze > examples-pip-freeze.txt
      - name: Run tests/examples
        run: |
          set -euo pipefail
          : > "$ML_AI_SKILLS_EXAMPLE_COVERAGE"
          python -m unittest discover -s tests/examples -t tests -p "test_*.py" -v 2>&1 | tee examples.log
      - name: Every runnable SKILL.md python block was executed (non-'# illustrative', current SKILL.md hash)
        run: python scripts/check_example_coverage.py
      - name: Runtime freshness checks (need the real libraries installed)
        run: python -m unittest discover -s tests -p "test_check_freshness.py" -v
      - name: Executable eval cases
        run: python scripts/run_evals.py --run-executable --out eval-exec-report.json
      - name: Tests left no stray files in the checkout
        # Example code writes artifacts (models, mlruns/, parquet). Everything must land in
        # temp dirs; only this job's own report files may appear in the workspace.
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/status.txt"
          grep -vE '^\?\? (examples\.log|example-coverage\.jsonl|eval-exec-report\.json|examples-pip-freeze\.txt)$'             "$RUNNER_TEMP/status.txt" > "$RUNNER_TEMP/stray.txt" || [ $? -eq 1 ]
          if [ -s "$RUNNER_TEMP/stray.txt" ]; then
            echo "::error::tests created or modified files in the checkout:"
            cat "$RUNNER_TEMP/stray.txt"
            exit 1
          fi
      - name: Report skipped tests
        if: always()
        run: |
          # No pipefail in the default shell, and grep exits 1 on "no match": test the
          # grep itself, so an empty list prints "none" and a missing log says so.
          {
            echo "### Skipped example tests"
            if [ ! -f examples.log ]; then
              echo "- (no examples.log: the test step did not run)"
            elif grep -E '\.\.\. skipped|^setUpClass .* skipped' examples.log > "$RUNNER_TEMP/skipped.txt"; then
              sed 's/^/- /' "$RUNNER_TEMP/skipped.txt"
            else
              echo "none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pip-audit the resolved example environment (transitive dependencies included)
        # Runs whenever the install succeeded, even if a test failed. pip-audit goes into its
        # own venv so it does not change the environment being audited; +cpu is stripped
        # because advisories are keyed by the public version (torch 2.13.0).
        if: always() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install --quiet "$(grep -E '^pip-audit==' requirements-dev.txt)"
          sed 's/+cpu$//' examples-pip-freeze.txt > "$RUNNER_TEMP/examples-audit.txt"
          wc -l < "$RUNNER_TEMP/examples-audit.txt"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --progress-spinner off --disable-pip --no-deps \
            -r "$RUNNER_TEMP/examples-audit.txt"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-reports
          path: |
            eval-exec-report.json
            examples.log
            examples-pip-freeze.txt
            example-coverage.jsonl
          if-no-files-found: warn
          retention-days: 30

  evals-offline:
    name: Offline evals + routing benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits, so HEAD^1 is available: for a pull_request run HEAD is GitHub's test
          # merge commit and HEAD^1 the base branch tip; for a push it is the previous commit.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Offline eval self-tests (fixtures, plans, coverage)
        run: python scripts/run_evals.py --out eval-report.json
      - name: Routing benchmark (test split) must not regress
        # Three checks, all on the test split, over all seven headline metrics:
        #  1. integrity: baseline.json's benchmark_sha256 must match benchmark.json, so the
        #     benchmark cannot change without a re-baseline;
        #  2. this commit's router meets this commit's baseline.json;
        #  3. no regression: this commit's router, run on the PARENT's benchmark, meets the
        #     PARENT's baseline. Lowering baseline.json or deleting hard benchmark cases in the
        #     same change therefore does not lower the bar. An intended regression has to land
        #     as its own reviewed change that only lowers baseline.json (see docs/ROUTING.md).
        # Check 3 validates the parent's cases per case only: the per-skill coverage rule is for
        # this commit's benchmark (check 2), so adding a skill does not stop check 3. The
        # parent's labels are carried over to this tree: a case expecting a skill that no longer
        # exists, or a conflicting case whose forbidden skills are all gone, is dropped
        # (::warning, counted in the summary; removing a skill is also a BREAKING contract
        # change), removed slugs leave acceptable/forbidden, and a hard prerequisite this
        # commit added becomes acceptable unless the parent forbade it (then selecting it counts
        # as a forbidden selection). Anything that still does not validate fails the step - it
        # is never skipped with a warning. A new skill re-weights the router's IDF for every
        # skill, so even an unrelated one can move a parent case; that is a regression like any
        # other (lower baseline.json in its own reviewed change first).
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import eval_router as er
          import skills_lib as sl
          BENCH, BASELINE = "evals/routing/benchmark.json", "evals/routing/baseline.json"
          FLAGS = {"precision": "--min-precision", "recall": "--min-recall", "top1_accuracy": "--min-top1",
                   "task_accuracy": "--min-task-accuracy", "false_activation_rate": "--max-false-activation",
                   "mean_unnecessary_activations": "--max-unnecessary",
                   "forbidden_selection_rate": "--max-forbidden-rate"}
          summary, errors = [], 0


          def sha256(data):  # same normalisation as eval_router.benchmark_sha256
              return hashlib.sha256(data.replace(b"\r\n", b"\n")).hexdigest()


          def run(label, bench_path, baseline, report_path):
              floor = baseline["metrics"]["test"]
              args = [a for key, flag in FLAGS.items() if floor.get(key) is not None for a in (flag, str(floor[key]))]
              print(f"[{label}] floors: {' '.join(args)}", flush=True)
              with open(report_path, "w", encoding="utf-8") as out:
                  code = subprocess.call([sys.executable, "scripts/eval_router.py", "--benchmark", bench_path,
                                          "--split", "test", "--top-k", str(baseline.get("top_k", 5)), "--json", *args],
                                         stdout=out)
              if code == 2:
                  return code, "benchmark did not validate (see stderr above)"
              report = json.load(open(report_path, encoding="utf-8"))
              print(json.dumps(report["splits"]["test"], indent=2))
              for failure in report["threshold_failures"]:
                  print(f"::error::routing regression [{label}]: {failure}")
              return code, "pass" if code == 0 else "; ".join(report["threshold_failures"])


          head = json.loads(Path(BASELINE).read_text(encoding="utf-8"))
          if head.get("benchmark_sha256") != sha256(Path(BENCH).read_bytes()):
              print(f"::error::{BASELINE} benchmark_sha256 does not match {BENCH}: re-baseline after editing the benchmark")
              errors += 1
              summary.append("- integrity: FAIL (benchmark_sha256 mismatch)")
          else:
              summary.append("- integrity: pass")
          code, msg = run("own baseline", BENCH, head, "router-report.json")
          errors += code != 0
          summary.append(f"- this commit's router vs this commit's baseline: {msg}")


          def at_parent(path):
              r = subprocess.run(["git", "show", f"HEAD^1:{path}"], capture_output=True)
              return r.stdout if r.returncode == 0 else None


          def parent_cases_that_apply(bench, skills):
              """The parent's benchmark with its labels carried over to this tree (see the step comment)."""
              valid, requires = {s.slug for s in skills}, er.requires_map(skills)
              kept, dropped, relabelled = [], [], []
              for case in bench.get("cases") or []:
                  if not isinstance(case, dict) or not all(isinstance(case.get(k), list) for k in er.LABEL_KEYS):
                      kept.append(case)  # malformed: validate_benchmark reports it
                      continue
                  if any(s not in valid for s in case["expected"]) or (
                          case.get("category") == "conflicting" and case["forbidden"]
                          and not any(s in valid for s in case["forbidden"])):
                      dropped.append(str(case.get("id")))
                      continue
                  case = {**case, "acceptable": [s for s in case["acceptable"] if s in valid],
                          "forbidden": [s for s in case["forbidden"] if s in valid]}
                  labelled = set(case["expected"]) | set(case["acceptable"])
                  new = sorted({p for s in labelled for p in er.prerequisite_closure(s, requires)}
                               - labelled - set(case["forbidden"]))
                  if new:
                      case["acceptable"] = case["acceptable"] + new
                      relabelled.append(str(case.get("id")))
                  kept.append(case)
              return {**bench, "cases": kept}, dropped, relabelled


          parent = subprocess.run(["git", "rev-parse", "--verify", "--quiet", "HEAD^1"],
                                  capture_output=True, text=True).stdout.strip()
          parent_baseline, parent_bench = (at_parent(BASELINE), at_parent(BENCH)) if parent else (None, None)
          if parent_baseline is None or parent_bench is None:
              print("::warning::no parent commit with a routing baseline; the no-regression check did not run")
              summary.append("- vs parent: NOT RUN (no parent commit with a baseline)")
          else:
              label, skills = f"parent {parent[:12]}", sl.load_all_skills()
              base, bench = json.loads(parent_baseline), json.loads(parent_bench)
              adapted, dropped, relabelled = (parent_cases_that_apply(bench, skills) if isinstance(bench, dict)
                                              else (bench, [], []))
              problems = er.validate_benchmark(adapted, {s.slug for s in skills})
              if dropped:
                  print(f"::warning::{len(dropped)} {label} case(s) expect a skill this commit no longer has "
                        f"and were dropped from the no-regression check: {', '.join(dropped)}")
              if problems:
                  for p in problems:
                      print(f"::error::{label} benchmark does not validate against this commit's skills: {p}")
                  errors += 1
                  summary.append(f"- vs {label}: FAIL ({len(problems)} benchmark validation error(s); see the log)")
              else:
                  floor = base["metrics"]["test"]
                  floors = {flag: floor[metric] for flag, (metric, _kind) in er.THRESHOLD_FLAGS.items()
                            if floor.get(metric) is not None}
                  print(f"[{label}] floors: {floors}", flush=True)
                  report = er.evaluate(adapted["cases"], er.load_route_fn(None), top_k=base.get("top_k", 5),
                                       split="test")
                  report.pop("cases")
                  failures = er.check_thresholds(report["splits"]["test"], floors)
                  report.update(threshold_failures=failures, dropped_cases=dropped, relabelled_cases=relabelled)
                  Path("router-report-parent.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n",
                                                               encoding="utf-8")
                  print(json.dumps(report["splits"]["test"], indent=2))
                  for failure in failures:
                      print(f"::error::routing regression [{label}]: {failure}")
                  errors += bool(failures)
                  note = (f" ({len(dropped)} case(s) dropped for removed skills, {len(relabelled)} relabelled "
                          "for new prerequisites)") if dropped or relabelled else ""
                  summary.append(f"- this commit's router vs {label}'s benchmark + baseline: "
                                 f"{'; '.join(failures) or 'pass'}{note}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Routing benchmark gate (test split)\n" + "\n".join(summary) + "\n")
          print("\n".join(summary))
          sys.exit(1 if errors else 0)
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports
          path: |
            eval-report.json
            router-report.json
            router-report-parent.json
          if-no-files-found: warn
          retention-days: 30

  generated:
    name: Generated artifacts are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Regenerate into a temporary copy and diff (attribution, CRLF, idempotence)
        run: python scripts/check_generated.py
      - name: Regenerate in place, then require a clean git status
        run: python scripts/check_generated.py --in-place

  installer:
    name: Installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Use the system bash 3.2 and BSD tools on macOS
        if: runner.os == 'macOS'
        run: echo "/bin" >> "$GITHUB_PATH"
      - name: Show the shell the tests will use
        run: |
          command -v bash
          bash --version | head -1
      - name: Make installer scripts executable
        run: chmod +x install.sh uninstall.sh bin/ml-ai-skills
      - name: Run installer tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_install*.py" -v 2>&1 | tee installer.log
          python -m unittest discover -s tests -p "test_list_skills.py" -v 2>&1 | tee -a installer.log
      - name: Report skipped tests
        if: always()
        run: |
          # No pipefail in the default shell, and grep exits 1 on "no match": test the
          # grep itself, so an empty list prints "none" and a missing log says so.
          {
            echo "### Skipped installer tests (${RUNNER_OS})"
            if [ ! -f installer.log ]; then
              echo "- (no installer.log: the test step did not run)"
            elif grep -E '\.\.\. skipped|^setUpClass .* skipped' installer.log > "$RUNNER_TEMP/skipped.txt"; then
              sed 's/^/- /' "$RUNNER_TEMP/skipped.txt"
            else
              echo "none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: Plugin/marketplace packaging (claude CLI validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"  # @anthropic-ai/claude-code 2.1.x declares engines.node >=22
      - name: plugins/ and .claude-plugin/ match the generator
        run: python scripts/generate_plugins.py --check
      - name: Install the pinned Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Validate marketplace.json against the native schema
        run: claude plugin validate . --strict
      - name: Validate every plugin manifest against the native schema
        run: |
          set -euo pipefail
          for d in plugins/*/; do
            echo "== $d =="
            claude plugin validate "$d" --strict
          done
      # tests/test_generate_plugins.py asserts on `claude` return codes only (not --json
      # output or --yes/-y flags): CLI builds differ in their flag surface.
      - name: Plugin/marketplace unit + local-install tests (the CLI tests must not skip here)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_generate_plugins.py" -v 2>&1 | tee plugins.log
          if grep -E '\.\.\. skipped|^setUpClass .* skipped' plugins.log; then
            echo "::error::claude-CLI tests skipped although the CLI was installed"
            exit 1
          fi

  security:
    name: Security (workflow audit, pip-audit, bandit rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Audit GitHub workflows
        run: python scripts/audit_workflows.py --strict
      - name: Install the pinned pip-audit and ruff from requirements-dev.txt
        run: python -m pip install "$(grep -E '^pip-audit==' requirements-dev.txt)" "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: pip-audit the direct pins only (transitive deps are audited in examples / unit-with-dev-deps)
        # --no-deps audits the exact top-level pins without installing anything; the
        # resolved environments (incl. transitive packages) are audited in the examples and
        # unit-with-dev-deps jobs. The +cpu local version tag is stripped because the PyPI
        # advisory data is keyed by the public version (torch 2.13.0).
        run: |
          set -euo pipefail
          sed 's/+cpu//' requirements-examples.txt > "$RUNNER_TEMP/requirements-examples-audit.txt"
          pip-audit --progress-spinner off --disable-pip --no-deps -r requirements-dev.txt -r "$RUNNER_TEMP/requirements-examples-audit.txt"
      - name: ruff security rules (flake8-bandit, S)
        # --select replaces ruff.toml's select *and* its global ignore list, so the two
        # justified global ignores are repeated here; per-file ignores still apply.
        run: ruff check --select S --ignore S603,S607 --output-format=github .

  link-check:
    name: Live reference-link check (manual, network-dependent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual trigger only: external sites rate-limit and flake, and merges must not
    # depend on third-party availability.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python scripts/validate_skills.py --check-links --warnings
