name: skill-library-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills, index, graph, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No `pip install` step on purpose: scripts/ and tests/ are stdlib-only
      # by design (see scripts/skills_lib.py docstring). If a future change
      # needs a real dependency, add a requirements-dev.txt and a `pip
      # install -r` step here rather than assuming it's implicitly available.

      - name: Validate skill frontmatter/sections/relationships
        run: python scripts/validate_skills.py --warnings

      - name: Check INDEX.md matches skill folders
        run: python scripts/generate_index.py --check

      - name: Check dependency graph doc is up to date and acyclic
        run: python scripts/build_dependency_graph.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate eval case files
        run: python scripts/validate_evals.py

      - name: Check README.md PROJECT-STATS block is up to date
        run: python scripts/generate_readme_stats.py --check

  plugins:
    name: Plugin/marketplace packaging (generation drift + native schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check plugins/ and .claude-plugin/marketplace.json are not stale
        run: python scripts/generate_plugins.py --check

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace.json against the native Claude Code schema
        run: claude plugin validate . --strict

      - name: Validate every plugin manifest against the native Claude Code schema
        run: |
          set -euo pipefail
          for d in plugins/*/; do
            echo "== $d =="
            claude plugin validate "$d" --strict
          done

      # tests/test_generate_plugins.py asserts on `claude` returncodes only
      # (not --json output or --yes/-y flags) — different `claude` CLI builds
      # have different flag surfaces, confirmed the hard way when this job's
      # public npm-installed CLI rejected flags a locally-installed build
      # accepted.
      - name: Run plugin/marketplace unit + local-install tests
        run: python -m unittest discover -s tests -p "test_generate_plugins.py" -v

  freshness:
    name: Freshness scan (known-stale patterns only, non-blocking for REVIEW_DUE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for known-stale APIs / pinned model snapshots
        run: python scripts/check_freshness.py
        # Exits 1 only on STALE findings (known-removed APIs). REVIEW_DUE
        # findings (missing last_verified, missing version_constraints) are
        # printed but do not fail CI — they are a maintenance backlog, not a
        # correctness regression. See docs/FRESHNESS.md.

  installer:
    name: Installer tests (install.sh / uninstall.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Make installer scripts executable
        run: chmod +x install.sh uninstall.sh
      - name: Run installer tests
        run: python -m unittest discover -s tests -p "test_install.py" -v

  link-check:
    name: Live reference-link check (optional, network-dependent)
    runs-on: ubuntu-latest
    # Manual trigger only — external sites rate-limit / flake, and CI must
    # not depend on third-party availability to gate merges (Phase 19).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_skills.py --check-links --warnings
