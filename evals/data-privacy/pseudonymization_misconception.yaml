id: pseudonymization_misconception
skill: data-privacy
category: misconception
kind: response
input: |
  I replaced all the names with random IDs, so the dataset is now anonymized and I can share it freely.
expected_behavior:
  - 'distinguishes pseudonymization (replacing direct identifiers with a stand-in, but re-identification remains possible via other fields or a mapping table) from true anonymization'
  - 'flags quasi-identifiers (zip code, birth date, gender, rare combinations) as a re-identification/linkage risk even with names removed'
  - 'notes this distinction has real regulatory weight (e.g. GDPR treats pseudonymized data as still personal data) without citing a specific legal conclusion as universal across jurisdictions'
  - 'recommends stronger techniques where warranted (k-anonymity/l-diversity checks, generalization/suppression of quasi-identifiers, or differential privacy) instead of declaring the job done'
must_not:
  - 'agree that ID-swapping alone constitutes anonymization safe for unrestricted sharing'
must_include:
  - '\bpseudonymi[sz]\w*'
  - '\b(re-?identif\w+|linkage|link(ed|ing)? (back|it|records|with)|singl(e|ed|es|ing) out)\b'
  - '\b(quasi[- ]identif\w+|(zip|postal) codes?|zip|postcodes?|birth ?dates?|dates? of birth|age|gender|sex)\b'
  - '\b(GDPR|personal data|HIPAA|CCPA|regulat\w+|legal\w*|jurisdiction\w*|law)\b'
  - '\b(k-?anonymity|l-?diversity|t-?closeness|differential(ly)? privacy|generali[sz]\w+|suppress\w+|aggregat\w+|synthetic data)\b'
must_not_include:
  - '\A\W*(yes|yeah|yep|yup|sure|absolutely|definitely|correct|exactly|right|indeed|agreed|of course|good news|great news|that''s (right|correct)|you''re (right|correct))\b(?![\s,!.:;-]*(not|but)\b)'
  - '(?<!before )(?<!until )(?<!if )\b(you can|you''re free to|feel free to|go ahead and|it''s fine to|it is fine to|safe to) (now )?(safely )?(share|publish|release|distribute) (it|the (data|dataset)|this (data|dataset))( freely| publicly| openly| without restriction)?\b(?![^.]{0,50}\b(only|once|after|if|unless|when)\b)'
  - '\b(is|are|counts as|now|effectively|basically|essentially|practically) (now |effectively |basically |essentially |fully |properly )?anonymi[sz](ed|ation)\b(?![^.]{0,30}\b(isn''t|is not|it''s not|wrong|incorrect)\b)'
  - '(?<!n''t )(?<!not )(?<!never )\b(removes|eliminates|no) (the )?(re-?identification|linkage) risk\b'
  - '\b(GDPR|HIPAA|CCPA|regulations?|the law)\b[^.]{0,20}\b(doesn''t|does not|no longer|won''t|will not) (apply|applies)\b'
  - '(?<!mean it is )(?<!mean it''s )\bno longer (considered )?personal data\b'
  - '\b(don''t|do not|won''t) need (to apply |to use )?(k-?anonymity|l-?diversity|differential privacy|generali[sz]ation|suppression)'
  - '\b(quasi[- ]identifiers?|zip codes?|birth ?dates?|age|gender|fields)\b[^.]{0,40}\b(are|is) (harmless|safe|fine)\b'
limitations:
  - 'Regex assertions check that the key concepts are stated, not that the reasoning is sound; expected_behavior/must_not remain the authoritative rubric.'
  - 'The case checks that regulation is mentioned, not that a jurisdiction-specific legal conclusion is correct; legal accuracy needs human review.'
notes: >
  Tests the "pseudonymization != anonymization" distinction that is a named Gotcha in
  data-privacy/SKILL.md.
