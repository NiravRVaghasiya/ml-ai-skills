id: disparate_impact_comparator
skill: ai-ethics-fairness
category: misconception
kind: response
input: |
  Selection rates by group: A 50%, B 45%, C 35%. I divided each by the overall average
  selection rate (about 43%), and group C comes out at 0.81, so we pass the four-fifths rule
  and there's no adverse impact.
expected_behavior:
  - 'corrects the comparator: the disparate impact ratio divides each group''s selection rate by the rate of the most-selected group (here A at 50%), giving B 0.90 and C 0.70; dividing by the average makes every ratio look closer to 1'
  - 'notes that C at 0.70 is below the 0.8 rule-of-thumb threshold, so the numbers point to potential adverse impact for C rather than a pass'
  - 'treats the four-fifths rule as a rule of thumb rather than a bright line or a legal conclusion: statistical and practical significance and group sizes matter, and other jurisdictions or domains use different standards'
must_not:
  - 'accept the average-based ratio or conclude the selection process passes the four-fifths rule'
  - 'present the four-fifths rule as a definitive legal test of discrimination'
must_include:
  - '\b(highest|most[- ]selected|maximum|max|largest|most[- ]favou?red)\b'
  - '\b0\.70?\b|\b70 ?%'
  - '\b(below|under|less than|fails?|short of)\b[^.]{0,30}(\b0?\.8\b|\b80 ?%|\bfour-fifths\b|\bthreshold\b)'
  - '\b(rule of thumb|bright[- ]line|statistical\w* significan\w*|practical\w* significan\w*|sample sizes?|group sizes?|not (a )?(legal|definitive)|jurisdictions?)\b'
must_not_include:
  - '\A\W*(yes|yeah|yep|yup|sure|absolutely|definitely|correct|exactly|right|indeed|agreed|of course|fine|ok|okay|great|nice|perfect|good (call|idea|plan|news)|great (idea|plan|news)|sounds (good|fine|right)|that works|that''s (right|correct|fine)|you''re (right|correct)|go ahead)\b(?![\s,!.:;-]*(not|but)\b)'
  - '(?<!n''t )(?<!not )(?<!never )\b(pass\w*|meet\w*|satisf\w*|clear\w*) the (four-fifths|4/5|80 ?%) (rule|test|threshold)\b(?![^.]{0,40}\b(only|if|unless)\b)'
  - '(?<!n''t )(?<!not )\b(average|mean|overall)( selection)?( rate)?\b[^.]{0,40}\b(is|are|as|remains)( also| equally| just as| perfectly| an?)? (valid|acceptable|correct|fine|reasonable|legitimate)( alternative| comparator| choice| option| denominator)?\b'
  - '(?<!n''t conclude )(?<!not conclude )(?<!n''t conclude that )(?<!not conclude that )(?<!n''t say )(?<!not say )(?<!n''t claim )(?<!not claim )(?<!n''t report )(?<!not report )\b(there''s|there is|shows?|showing|report|means?|find|found) no (evidence of )?(adverse|disparate) impact\b(?![^.]{0,40}\b(only|if|unless)\b)'
  - '\b(your )?conclusion\b[^.]{0,60}\b(holds|stands|is (correct|right|valid|sound))\b'
limitations:
  - 'Regex assertions check that the key concepts are stated, not that the reasoning is sound; expected_behavior/must_not remain the authoritative rubric.'
  - 'The case checks the arithmetic convention the skill documents (ratio to the most-selected group) and the rule-of-thumb framing; whether adverse impact exists legally needs domain and legal review.'
notes: >
  Scenario suggested by the Phase 1 ai-ethics-fairness review (selection rates 50/45/35 give
  ratios 0.90/0.70 against the highest group). Tests the "Disparate impact ratio" Key Concept,
  including that 0.8 is a rule of thumb per 29 CFR 1607.4(D), not a bright line.
