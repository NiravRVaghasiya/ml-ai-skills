id: multiclass_shap_class_axis
skill: explainability
category: edge_case
kind: executable
input: |
  For my 3-class RandomForest, `TreeExplainer(model)(X_test).values` has shape (200, 5, 3) and
  `shap.plots.bar` crashes. The tutorial I copied does `shap_values[:, :, 1]`, so I'll use that
  and present the plot as "feature importance for the model".
expected_behavior:
  - 'explains the trailing axis holds one attribution set per class; [:, :, 1] explains only class 1''s predicted probability (the "positive class" convention comes from binary classification)'
  - 'recommends choosing the class to explain explicitly (a class_index the user sets) and labeling the plot with that class, or producing one plot per class / a global ranking from mean absolute SHAP across classes, rather than presenting class 1 as the whole model'
  - 'warns against summing signed attributions across classes: for probability outputs they cancel (observed ~1e-16 per feature for a scikit-learn RandomForest with shap 0.54.1), so the sum says nothing'
must_not:
  - 'present the class-1 slice as the model''s overall feature importance'
must_include:
  - '\b(per[- ]class|each class|one (set|array|slice|attribution set)s? (per|for each) class|class axis|trailing axis|last axis|third (axis|dimension)|n_classes)\b'
  - '\b(class_index|which class|the class you (want to )?explain|explicit\w*|choose (the|a|which) class|pick (the|a|which) class|select (the|a|which) class)\b'
  - '\b(only|just)\b[^.]{0,30}\bclass( 1| one)?\b|\b(whole|entire|overall) model\b'
  - '\b(mean (absolute|abs)|mean\(?\|?abs|average (of )?(the )?absolute|one (plot|chart) per class|each class separately|per[- ]class (plots?|charts?))\b'
must_not_include:
  - '\A\W*(yes|yeah|yep|yup|sure|absolutely|definitely|correct|exactly|right|indeed|agreed|of course|fine|ok|okay|great|nice|perfect|good (call|idea|plan|news)|great (idea|plan|news)|sounds (good|fine|right)|that works|that''s (right|correct|fine)|you''re (right|correct)|go ahead)\b(?![\s,!.:;-]*(not|but)\b)'
  - '(?<!n''t )(?<!not )(?:\bclass 1\b|\bindex 1\b|\[:, ?:, ?1\])[^.]{0,40}(\bis fine\b|\bworks fine\b|\bis ok(ay)?\b|\bgives the (overall|whole|global)\b|\brepresents the (whole|overall|entire) model\b|\bshows the (overall|whole|global)\b)'
  - '(?<!n''t )(?<!not )(?<!never )\b(sum|add)\w* (the )?(signed )?(shap )?(values )?(across|over) (the )?(classes|class axis|last axis)\b(?![^.]{0,40}\b(cancel\w*|zero|wrong|meaningless)\b)'
executable_tests:
  - 'examples.test_explainability.ExplainabilityShapExamples.test_multiclass_class_index_is_explicit'
  - 'examples.test_explainability.ExplainabilityShapExamples.test_tree_workflow_with_random_forest_multi_output'
requires:
  - 'example-deps'
artifacts:
  - '2-D SHAP values for an explicitly chosen class whose sum plus base value reproduces predict_proba for that class'
limitations:
  - 'Regex assertions check that the key concepts are stated, not that the reasoning is sound; expected_behavior/must_not remain the authoritative rubric.'
  - 'The executable tests prove the skill''s tree block selects the class given by class_index (additivity checked against predict_proba for class 2 of a 3-class forest); they do not grade the response.'
notes: >
  Tests the "Multi-output SHAP values" Gotcha and the explicit class_index in explainability
  Workflow step 3, which Phase 1 changed from a hard-coded class 1.
