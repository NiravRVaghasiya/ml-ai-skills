id: conflicting_sources
skill: rag-evaluation
category: edge_case
kind: response
input: |
  Retrieval returned two documents for "what is our current refund window": one
  says 14 days (dated last year), another says 30 days (dated last month). The
  generated answer says "14 days." Faithfulness check says it's grounded (it does
  match one of the retrieved documents). Is that the end of the analysis?
expected_behavior:
  - 'identifies this as the "conflicting sources" RAG failure mode, not a faithfulness pass that ends the analysis'
  - 'explains that being faithful to *a* retrieved document is not sufficient when retrieved documents disagree — the pipeline picked the wrong (stale) one'
  - 'recommends a fix at the retrieval/ranking or indexing layer (recency-aware ranking, deduplicating/superseding stale versions) rather than a generation-layer fix'
must_not:
  - 'conclude the answer is fine because it passed a faithfulness check against some retrieved document'
must_include:
  - '\b(conflict\w*|contradict\w*|disagree\w*|inconsisten\w+)\b'
  - '\b(stale|outdated|out[- ]of[- ]date|superseded|obsolete|older|newer|more recent|most recent|latest|current (version|policy))\b'
  - '\b(faithful\w*|grounded\w*)\b[^.]{0,120}\b(not (the same as|sufficient|enough|correct)|isn''?t (the same as|sufficient|enough|correct)|insufficient|(doesn''?t|does not) (mean|guarantee|imply|make)|but (still )?(wrong|incorrect|stale|outdated))'
  - '\b(recency[- ](aware|weight\w*|boost\w*|bias\w*)|(date|time|recency)[- ](aware|filter\w*|weight\w*)|metadata (filter\w*|boost\w*)|effective[- ]dates?|dedup\w*|supersed\w+|re-?rank\w*|ranking|re-?index\w*|index\w*|version(ing|ed)|archiv\w+)\b'
must_not_include:
  - '\A\W*(yes|yeah|yep|correct|right|absolutely)\b(?![\s,!.:;-]*(not|but)\b)'
  - '\b(that''s|that is|it''s|it is|this is) (the end of (the|it)|fine|ok|okay|sufficient)\b(?![^.]{0,40}\b(only|if|but)\b)'
  - '\b(grounded|faithful) (answers?|responses?) (is|are) (a )?(correct|right|accurate)\b'
  - '\b(analysis|evaluation) (is|was) (complete|done|finished|over)\b(?![^.]{0,40}\b(only|if|once|when)\b)'
limitations:
  - 'Regex assertions check that the key concepts are stated, not that the reasoning is sound; expected_behavior/must_not remain the authoritative rubric.'
notes: >
  Tests whether the skill catches that "faithful" and "correct end-to-end answer"
  diverge specifically under source conflict, per Workflow step 6 and the Gotchas
  entry on faithfulness vs. correctness.
